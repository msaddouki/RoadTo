name: roadto
description: "RoadTo: community navigation and road alerts, without tracking."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  roadto_core:
    path: ../packages/roadto_core
  maplibre_gl: ^0.27.1
  geolocator: ^14.1.1
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.4.0
  path_provider: ^2.1.6
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Signed region package copied here by CI (see assets/regions/lyon/README.md).
    - assets/regions/lyon/
