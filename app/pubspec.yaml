name: roadto
description: "RoadTo: community navigation and road alerts, without tracking."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  roadto_core:
    path: ../packages/roadto_core
  maplibre_gl: ^0.27.1
  # Apple implementation only: geolocator_android would add Google Play
  # Services; Android uses its LocationManager (DeviceLocation.kt).
  geolocator_apple: ^2.3.14
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.4.0
  path_provider: ^2.1.6
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Signed region package copied here by CI (see assets/regions/lyon/README.md).
    - assets/regions/lyon/
    - assets/fonts/OFL.txt
  # Atkinson Hyperlegible (Braille Institute; SIL OFL 1.1, assets/fonts/OFL.txt):
  # drawn to keep similar characters apart, for reading at a glance.
  fonts:
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf
          weight: 800
    - family: Atkinson Hyperlegible Mono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Bold.ttf
          weight: 700
