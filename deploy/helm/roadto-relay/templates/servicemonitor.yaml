{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "roadto-relay.fullname" . }}
  labels:
    {{- include "roadto-relay.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "roadto-relay.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
