name: roadto_strfry_policy
description: strfry write-policy plugin enforcing the RoadTo rules from roadto_core.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  roadto_core:
    path: ../../packages/roadto_core

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

# The plugin never touches SQLite; use the system library so no prebuilt
# binary is fetched when resolving roadto_core's dependencies.
hooks:
  user_defines:
    sqlite3:
      source: system
