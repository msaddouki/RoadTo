# Dependency updates, opened as pull requests once a week and grouped per
# ecosystem so they stay few. Security updates are not delayed by this
# schedule. CI checks every update like any other PR.
version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /app
      - /packages/roadto_core
      - /relay/dev_relay
      - /relay/strfry_policy
    schedule:
      interval: weekly
      day: monday
    groups:
      dart:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
      day: monday
    groups:
      android:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /relay/strfry
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
