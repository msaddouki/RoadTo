name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its previous run. Every commit on master keeps
# its own run, so a merge that breaks something shows up even when several
# PRs are merged in a row.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  core:
    name: Core and relay (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          (cd packages/roadto_core && dart pub get)
          (cd relay/dev_relay && dart pub get)
          (cd relay/strfry_policy && dart pub get)
          (cd app && flutter pub get)
      # The app and the relays use roadto_core by path: a change to its
      # pubspec (by hand or by Dependabot) must come with their lockfiles.
      - name: Lockfiles up to date
        run: |
          if ! git diff --exit-code -- '*/pubspec.lock'; then
            echo "::error::pubspec.lock out of date: run pub get in app/ and relay/*/ and commit the lockfiles"
            exit 1
          fi
      # After pub get: the formatter reads the line width from analysis_options.yaml.
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages relay app/lib app/test
      - name: roadto_core
        working-directory: packages/roadto_core
        run: |
          sudo apt-get install -y -q libsqlite3-dev # core tests use the system SQLite (FTS5)
          dart analyze --fatal-infos
          dart test
      - name: Dev relay (end to end)
        working-directory: relay/dev_relay
        run: |
          dart analyze --fatal-infos
          dart test

  relay-image:
    name: Relay image (strfry + policy, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Plugin tests
        working-directory: relay/strfry_policy
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Log redaction tests
        run: |
          pip install -q pytest
          python -m pytest -q relay/strfry
      - name: Start two relays
        working-directory: relay/strfry
        # The load test publishes from a single address: lift the per-client
        # rate limit (30 a minute in production) for these relays.
        run: ROADTO_RATE_PER_MINUTE=100000 docker compose up -d --build
      - name: Wait for the relays
        run: |
          for i in $(seq 60); do
            curl -fsS http://localhost:7777 >/dev/null && curl -fsS http://localhost:7778 >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Publish to one relay, read from the other, check refusals
        working-directory: relay/strfry_policy
        run: dart run tool/smoke.dart ws://localhost:7777 ws://localhost:7778
      - name: Load test, delivery from one relay to the other
        working-directory: relay/strfry_policy
        run: dart run tool/load.dart --writer ws://localhost:7777 --reader ws://localhost:7778 --rate 30 --seconds 30 --max-p95 5
      - name: No client address in the relay logs
        working-directory: relay/strfry
        run: |
          docker compose logs --no-color > relay.log
          grep -c "Connect from \[address\]" relay.log
          if grep -En '([0-9]{1,3}\.){3}[0-9]{1,3}|(Connect|Disconnect) from [^[]' relay.log; then
            echo "::error::client address found in the relay logs"
            exit 1
          fi
      - name: Relay logs
        if: always()
        working-directory: relay/strfry
        run: docker compose logs --no-color | tail -100

  relay-helm:
    name: Relays on Kubernetes (kind + Helm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Lint the chart
        run: |
          helm lint deploy/helm/roadto-relay
          helm lint deploy/helm/roadto-relay --set ingress.enabled=true \
            --set metrics.serviceMonitor.enabled=true --set realIpHeader=x-forwarded-for
      - name: Build the relay image
        run: docker build -f relay/strfry/Dockerfile -t roadto-relay:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: roadto
      - name: Install two relays
        run: |
          kind load docker-image roadto-relay:ci --name roadto
          helm install roadto-relay deploy/helm/roadto-relay \
            --set image.repository=roadto-relay --set image.tag=ci --set image.pullPolicy=Never \
            --set persistence.size=1Gi --wait --timeout 5m
          kubectl get pods -o wide
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Publish on one relay, read from the other
        run: |
          kubectl port-forward pod/roadto-relay-0 7777:7777 >/dev/null 2>&1 &
          kubectl port-forward pod/roadto-relay-1 7778:7777 >/dev/null 2>&1 &
          for i in $(seq 30); do
            curl -fsS localhost:7777 >/dev/null && curl -fsS localhost:7778 >/dev/null && break
            sleep 2
          done
          cd relay/strfry_policy
          dart pub get
          dart run tool/smoke.dart ws://localhost:7777 ws://localhost:7778
      - name: Metrics
        run: |
          kubectl port-forward pod/roadto-relay-0 9464:9464 >/dev/null 2>&1 &
          for i in $(seq 30); do curl -fsS localhost:9464/metrics > metrics.txt && break; sleep 2; done
          cat metrics.txt
          grep -q 'action="accept",reason="ok",source="client",kind="alert"' metrics.txt
          grep -q 'reason="blocked"' metrics.txt
      - name: No client address in the relay logs
        run: |
          kubectl logs -l app.kubernetes.io/name=roadto-relay --tail=-1 > relay.log
          if grep -En '([0-9]{1,3}\.){3}[0-9]{1,3}|(Connect|Disconnect) from [^[]' relay.log; then
            echo "::error::client address found in the relay logs"
            exit 1
          fi
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/name=roadto-relay --tail=200 --prefix

  pipeline:
    name: Region pipeline (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -r pipeline/requirements.txt
      - run: python -m pytest -q pipeline/tests
        env:
          PYTHONPATH: pipeline
      - run: bash -n pipeline/build_region.sh

  dependencies:
    name: Dependencies (known vulnerabilities, SBOM)
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER: v2.6.0
      SYFT: 1.52.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tools, checked against their published checksums
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          base=https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER
          curl -fsSL -o osv-scanner_linux_amd64 "$base/osv-scanner_linux_amd64"
          curl -fsSL "$base/osv-scanner_SHA256SUMS" | grep ' osv-scanner_linux_amd64$' | sha256sum -c -
          mv osv-scanner_linux_amd64 osv-scanner && chmod +x osv-scanner
          base=https://github.com/anchore/syft/releases/download/v$SYFT
          curl -fsSL -o "syft_${SYFT}_linux_amd64.tar.gz" "$base/syft_${SYFT}_linux_amd64.tar.gz"
          curl -fsSL "$base/syft_${SYFT}_checksums.txt" | grep " syft_${SYFT}_linux_amd64.tar.gz$" | sha256sum -c -
          tar -xzf "syft_${SYFT}_linux_amd64.tar.gz" syft
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Lockfiles as committed (Dart: app and relays; the core is resolved in
      # the app's lockfile). No resolution of ranges: it would guess the
      # oldest versions allowed, not the ones installed.
      - name: Known vulnerabilities in the lockfiles
        run: osv-scanner scan source --recursive --no-resolve .
      # requirements.txt pins only direct dependencies: check what pip
      # actually installs.
      - name: Known vulnerabilities in the installed pipeline packages
        run: |
          pip install -q -r pipeline/requirements.txt
          pip freeze > "$RUNNER_TEMP/requirements-installed.txt" # packages only, not pip itself
          osv-scanner scan source --no-resolve --lockfile "requirements.txt:$RUNNER_TEMP/requirements-installed.txt"
      - name: SBOM (SPDX)
        run: syft scan dir:. --quiet -o spdx-json=sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: roadto-sbom
          path: sbom.spdx.json
          retention-days: 30

  app:
    name: Flutter app (analyze and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

  android:
    name: Android APK
    needs: [core, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release build with the embedded region and routing graph (and
      # Valhalla for four ABIs) runs out of the runner's disk. Toolchains the
      # build never uses are removed first.
      - name: Free disk space
        run: tool/free_ci_disk.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # maplibre_gl 0.27 compiles with Java 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Embed the Lyon region (with the routing graph)
        run: tool/embed_region.sh lyon --with-routing
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Disk usage
        if: always()
        run: df -h / && du -sh app/build ~/.gradle 2>/dev/null || true
      - name: No trackers in the build
        working-directory: app/android
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > ../../deps.txt
          ../../tool/check_no_trackers.sh ../../deps.txt
      - uses: actions/upload-artifact@v4
        with:
          name: roadto-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  android-emulator:
    name: Android emulator (end to end)
    needs: [core, app]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: tool/free_ci_disk.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Embed the Lyon region (with the routing graph)
        run: tool/embed_region.sh lyon --with-routing
        env:
          GH_TOKEN: ${{ github.token }}
      # Built before the emulator starts: a cold build (Gradle, NDK, CMake)
      # running next to it starved the emulator, which hung and died.
      # flutter drive then only rebuilds what changed.
      - name: Build the app under test
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --debug --target-platform android-x64 -t integration_test/app_test.dart
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          # App (debug APK ~300 MB) and installed region (~200 MB) fit easily;
          # the emulator also needs this much free on the runner, plus ~1.4 GB.
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # One line: the action runs each line of `script` as its own command.
          script: tool/run_emulator_test.sh build/emulator-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadto-android-emulator-test
          path: build/emulator-test
          retention-days: 14

  ios:
    name: iOS app (simulator, unsigned)
    needs: [core, app]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Embed the Lyon region
        run: tool/embed_region.sh lyon
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --simulator --debug
          flutter build ios --release --no-codesign
      - name: Archive the simulator build
        run: cd app/build/ios/iphonesimulator && zip -qr ../../../../roadto-ios-simulator.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: roadto-ios-simulator
          path: roadto-ios-simulator.zip
          retention-days: 14
