name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  core:
    name: Cœur et relais (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances
        run: |
          (cd packages/roadto_core && dart pub get)
          (cd relay/dev_relay && dart pub get)
          (cd app && flutter pub get)
      # Après pub get : le formateur lit la largeur de ligne dans analysis_options.yaml.
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages relay app/lib app/test
      - name: roadto_core
        working-directory: packages/roadto_core
        run: |
          dart analyze --fatal-infos
          dart test
      - name: Relais de dev (bout en bout)
        working-directory: relay/dev_relay
        run: |
          dart analyze --fatal-infos
          dart test

  app:
    name: App Flutter (analyse et tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

  android:
    name: APK Android
    needs: [core, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Pas de traceur dans le build
        working-directory: app/android
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > ../../deps.txt
          ../../tool/check_no_trackers.sh ../../deps.txt
      - uses: actions/upload-artifact@v4
        with:
          name: roadto-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: App iOS (simulateur, sans signature)
    needs: [core, app]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --simulator --debug
          flutter build ios --release --no-codesign
      - name: Archive du build simulateur
        run: cd app/build/ios/iphonesimulator && zip -qr ../../../../roadto-ios-simulator.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: roadto-ios-simulator
          path: roadto-ios-simulator.zip
          retention-days: 14
