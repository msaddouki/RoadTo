name: Region packages

# Builds a region package (offline map, search index, style, routing graph)
# and, when the REGION_SIGNING_KEY secret is set, signs it and publishes it
# to the rolling GitHub Release `region-<id>`: app builds embed it from there
# (tool/embed_region.sh) and `<id>.roadto` can be imported in the app from a
# file. Without the secret, or when started with "publish" unticked (to try a
# pipeline change from a branch), the package is kept as a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region id (pipeline/regions/<id>.json)
        default: lyon
        required: true
      publish:
        description: Publish to the release (untick to only keep the package as an artifact)
        type: boolean
        default: true
  schedule:
    - cron: "17 3 1 * *" # monthly refresh of the OSM data

permissions:
  contents: write

concurrency:
  group: region-${{ inputs.region || 'lyon' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REGION: ${{ inputs.region || 'lyon' }}
      # The monthly run has no inputs and publishes. (Not `inputs.publish !=
      # false`: the expressions treat null as equal to false.)
      PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install -q -r pipeline/requirements.txt
      - name: Pipeline tests
        run: python -m pytest -q pipeline/tests
        env:
          PYTHONPATH: pipeline
      - uses: actions/cache/restore@v4
        with:
          path: pipeline/work/cache
          key: region-sources-${{ env.REGION }}-${{ github.run_id }}
          restore-keys: region-sources-${{ env.REGION }}-
      - name: Build
        run: pipeline/build_region.sh "$REGION"
        env:
          ROADTO_SIGNING_KEY: ${{ secrets.REGION_SIGNING_KEY }}
      # Saved even when a later step fails, so a retry skips the big downloads.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pipeline/work/cache
          key: region-sources-${{ env.REGION }}-${{ github.run_id }}
      - name: Summary
        run: |
          {
            echo "### Region package: $REGION"
            echo '```'
            ls -lh "pipeline/work/$REGION/package"
            echo '```'
            if [[ -f "pipeline/work/$REGION/package/manifest.json.sig" && "$PUBLISH" == true ]]; then
              echo "Signed and published to release \`region-$REGION\`."
            elif [[ -f "pipeline/work/$REGION/package/manifest.json.sig" ]]; then
              echo "Signed, **not published** (publish unticked): see the workflow artifact."
            else
              echo "**Unsigned**: add the \`REGION_SIGNING_KEY\` secret to publish (see pipeline/README.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: env.PUBLISH == 'true' && hashFiles(format('pipeline/work/{0}/package/manifest.json.sig', env.REGION)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="region-$REGION"
          pkg="pipeline/work/$REGION/package"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease \
            --target "$GITHUB_SHA" --title "Region package: $REGION" \
            --notes "Offline data for the RoadTo app. Map data © OpenStreetMap contributors (ODbL). Refreshed monthly."
          # Data files first, manifest last: a client never sees a manifest
          # that points at files not uploaded yet.
          data=()
          for f in style.tar.gz places.sqlite map.pmtiles routing.tar "$REGION.roadto"; do [[ -f "$pkg/$f" ]] && data+=("$pkg/$f"); done
          gh release upload "$tag" "${data[@]}" --clobber
          gh release upload "$tag" "$pkg/manifest.json" "$pkg/manifest.json.sig" --clobber
      - name: Keep the package as an artifact
        if: env.PUBLISH != 'true' || hashFiles(format('pipeline/work/{0}/package/manifest.json.sig', env.REGION)) == ''
        uses: actions/upload-artifact@v4
        with:
          name: region-${{ env.REGION }}-package
          path: pipeline/work/${{ env.REGION }}/package
          retention-days: 7
