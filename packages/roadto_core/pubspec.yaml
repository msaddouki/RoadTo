name: roadto_core
description: RoadTo business logic shared by Android and iOS (geo, guidance, Nostr alerts, offline regions).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  archive: ^4.0.0
  bip340: ^0.3.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  http: ^1.6.0
  pointycastle: ^4.0.0
  sqlite3: ^3.7.0
  # NFKC for NIP-49 passwords. Pinned: 0.3.3 is days old.
  unorm_dart: 0.3.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

# Tests run against the system SQLite (Linux CI and dev machines ship it with
# FTS5). The app does not set this and bundles its own SQLite build.
hooks:
  user_defines:
    sqlite3:
      source: system
